# Threat Intel Hashes Lookup
[threat_intel_hashes_lookup]
filename = threat_intel_hashes.csv
field_list = hash, threat_type, source, last_seen, confidence, malware_family, description
match_type = EXACT(hash)
case_sensitive_match = false

# Asset Inventory Lookup
[asset_inventory_lookup]
filename = asset_inventory.csv
field_list = host, asset_type, criticality, owner, location, os
match_type = WILDCARD(host)
case_sensitive_match = false

# User Identity Lookup
[user_identity_lookup]
filename = user_identity.csv
field_list = user, department, role, manager, is_privileged
match_type = EXACT(user)
case_sensitive_match = false

# Threat Intel IPs Lookup
[threat_intel_ips_lookup]
filename = threat_intel_ips.csv
field_list = ip_address, threat_type, source, last_seen, confidence, description
match_type = EXACT(ip_address)
case_sensitive_match = false

# Threat Intel Domains Lookup
[threat_intel_domains_lookup]
filename = threat_intel_domains.csv
field_list = domain, threat_type, source, last_seen, confidence, description
match_type = WILDCARD(domain)
case_sensitive_match = false
