# SOC-Analyst Saved Searches and Alerts
# Detection rules for security monitoring

# =============================================================================
# SAMPLE SEARCH (legacy)
# =============================================================================
[incident - sample search]
disabled = 1
search = `soc_analyst` | stats count by index
cron_schedule = 0 * * * *
earliest_time = -24h@h
latest_time = now
description = Example saved search for the SOC-Analyst app
is_scheduled = 1

# =============================================================================
# DETECTION RULES
# =============================================================================

[Detection] Brute Force Login Attempts
disabled = 0
search = `soc_auth` EventCode=4625 | stats count by user, src_ip | where count > 5
cron_schedule = */15 * * * *
earliest_time = -1h@h
latest_time = now
alert_type = number_of_events
alert_threshold = 1
alert_severity = high
description = Detecteert meerdere failed login pogingen (>5) binnen 1 uur. Mogelijke brute force aanval.
action.email = 1
action.email.subject = [SOC-Analyst] ALERT: Brute Force Login Attempts Detected

[Detection] Privilege Escalation - Token Elevation
disabled = 0
search = `soc_auth` EventCode=4672 | stats count by user, logon_id
cron_schedule = */30 * * * *
earliest_time = -4h@h
latest_time = now
alert_type = number_of_events
alert_threshold = 1
alert_severity = critical
description = Detecteert privilege escalation via token elevation (SeDebugPrivilege). Mogelijke compromise.
action.email = 1
action.email.subject = [SOC-Analyst] CRITICAL ALERT: Privilege Escalation Detected

[Detection] Suspicious Process - PowerShell Encoded Command
disabled = 0
search = `soc_endpoint` EventCode=1 (ProcessName="powershell.exe" OR ProcessName="pwsh.exe") (CommandLine="* -enc*" OR CommandLine="* -EncodedCommand*")
cron_schedule = */10 * * * *
earliest_time = -2h@h
latest_time = now
alert_type = number_of_events
alert_threshold = 1
alert_severity = high
description = Detecteert PowerShell met encoded commands. Vaak gebruikt door malware voor obfuscation.
action.email = 1
action.email.subject = [SOC-Analyst] ALERT: Suspicious PowerShell Encoded Command

[Detection] Lateral Movement - RDP to Multiple Hosts
disabled = 0
search = `soc_auth` EventCode=4624 LogonType=10 | stats dc(host) as host_count by user | where host_count > 3
cron_schedule = 0 * * * *
earliest_time = -1h@h
latest_time = now
alert_type = number_of_events
alert_threshold = 1
alert_severity = medium
description = Gebruiker maakt RDP verbinding met >3 hosts binnen 1 uur. Mogelijke lateral movement.
action.email = 1
action.email.subject = [SOC-Analyst] ALERT: Potential Lateral Movement Detected

[Detection] Data Exfiltration - Large Outbound Transfer
disabled = 0
search = `soc_network` | stats sum(bytes_out) as total_bytes by src_ip, dest_ip | where total_bytes > 500000000
cron_schedule = 0 */2 * * *
earliest_time = -2h@h
latest_time = now
alert_type = number_of_events
alert_threshold = 1
alert_severity = critical
description = Detecteert grote outbound data transfers (>500MB). Mogelijke data exfiltration.
action.email = 1
action.email.subject = [SOC-Analyst] CRITICAL ALERT: Large Outbound Data Transfer

[Detection] Account Lockout Events
disabled = 0
search = `soc_auth` EventCode=4740 | table _time user src_ip caller_computer_name
cron_schedule = */5 * * * *
earliest_time = -30m@m
latest_time = now
alert_type = number_of_events
alert_threshold = 1
alert_severity = medium
description = Gebruikersaccount is locked out. Vaak indicator van brute force of compromised account.
action.email = 1
action.email.subject = [SOC-Analyst] ALERT: Account Lockout Event

[Detection] Process Injection Detected (Sysmon Event ID 8)
disabled = 0
search = `soc_endpoint` EventCode=8 | table _time host user source_image target_image
cron_schedule = */15 * * * *
earliest_time = -1h@h
latest_time = now
alert_type = number_of_events
alert_threshold = 1
alert_severity = critical
description = Process injection gedetecteerd (Sysmon Event ID 8). Vaak malware techniek.
action.email = 1
action.email.subject = [SOC-Analyst] CRITICAL ALERT: Process Injection Detected

[Detection] Unusual Login Time (Outside Business Hours)
disabled = 0
search = `soc_auth` EventCode=4624 earliest=-1h@h latest=now | eval hour=strftime(_time,"%H") | where hour < 6 OR hour > 22 | stats count by user, hour
cron_schedule = 0 * * * *
earliest_time = -1h@h
latest_time = now
alert_type = number_of_events
alert_threshold = 1
alert_severity = low
description = Login buiten kantoortijden (voor 6:00 of na 22:00). Mogelijk ongeautoriseerde access.
action.email = 1
action.email.subject = [SOC-Analyst] INFO: Unusual Login Time Detected

[Detection] New Service Installation (Sysmon Event ID 7)
disabled = 0
search = `soc_endpoint` EventCode=7 | table _time host user image signature
cron_schedule = 0 * * * *
earliest_time = -4h@h
latest_time = now
alert_type = number_of_events
alert_threshold = 1
alert_severity = medium
description = Nieuwe image geladen in procesruimte. Mogelijke malware installatie of persistence.
action.email = 1
action.email.subject = [SOC-Analyst] ALERT: New Image Loaded (Potential Persistence)

[Detection] Scheduled Task Creation (Sysmon Event ID 12)
disabled = 0
search = `soc_endpoint` EventCode=12 | table _time host user TargetObject
cron_schedule = 0 */2 * * *
earliest_time = -4h@h
latest_time = now
alert_type = number_of_events
alert_threshold = 1
alert_severity = medium
description = Nieuwe scheduled task aangemaakt. Vaak gebruikt voor persistence door attackers.
action.email = 1
action.email.subject = [SOC-Analyst] ALERT: Scheduled Task Created
