<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentation Viewer - SOC-Analyst</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary: #0f0f1a;
            --secondary: #1a1a2e;
            --accent: #16213e;
            --highlight: #e94560;
            --text: #eaeaea;
            --text-muted: #a0a0a0;
            --success: #4caf50;
            --border: rgba(255, 255, 255, 0.1);
            --code-bg: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--highlight);
        }

        h1 {
            font-size: 2rem;
            color: var(--highlight);
        }

        .content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        /* Markdown Styles */
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            color: var(--highlight);
            margin-top: 2rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .markdown-content h1 { font-size: 2rem; }
        .markdown-content h2 { font-size: 1.75rem; }
        .markdown-content h3 { font-size: 1.5rem; }
        .markdown-content h4 { font-size: 1.25rem; }

        .markdown-content p {
            margin-bottom: 1rem;
            color: var(--text);
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 1rem;
            padding-left: 2rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
        }

        .markdown-content a {
            color: var(--highlight);
            text-decoration: none;
            transition: color 0.3s;
        }

        .markdown-content a:hover {
            color: var(--text);
            text-decoration: underline;
        }

        .markdown-content code {
            background: var(--code-bg);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            color: #ff79c6;
        }

        .markdown-content pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            overflow-x: auto;
        }

        .markdown-content pre code {
            background: transparent;
            padding: 0;
            color: var(--text);
        }

        .markdown-content blockquote {
            border-left: 4px solid var(--highlight);
            padding-left: 1.5rem;
            margin-bottom: 1rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            text-align: left;
        }

        .markdown-content th {
            background: rgba(233, 69, 96, 0.2);
            color: var(--highlight);
        }

        .markdown-content tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 1rem 0;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .error {
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid var(--highlight);
            border-radius: 8px;
            padding: 1.5rem;
            color: var(--highlight);
            margin-bottom: 1rem;
        }

        .file-selector {
            margin-bottom: 1.5rem;
        }

        .file-selector select {
            background: var(--accent);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .file-selector select:hover {
            border-color: var(--highlight);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .content {
                padding: 1.5rem;
            }

            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-link">
                ← Back to Documentation
            </a>
            <h1 id="doc-title">Documentation</h1>
            <div class="file-selector">
                <select id="file-select" onchange="loadFile(this.value)">
                    <option value="">Select a document...</option>
                    <option value="DEPLOYMENT.md">Deployment Guide</option>
                    <option value="USE_CASES.md">Use Cases</option>
                    <option value="LOOKUPS.md">Lookup Tables Guide</option>
                    <option value="TROUBLESHOOTING.md">Troubleshooting</option>
                    <option value="CHANGELOG.md">Changelog</option>
                </select>
            </div>
        </header>

        <div id="loading" class="loading" style="display: none;">
            Loading document...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="content" class="content markdown-content">
            <p>Select a document from the dropdown above, or navigate directly with a URL parameter:</p>
            <p><code>viewer.html?file=DEPLOYMENT.md</code></p>
        </div>
    </div>

    <script>
        // Configure marked options
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        // Available markdown files
        const availableFiles = [
            'DEPLOYMENT.md',
            'USE_CASES.md',
            'LOOKUPS.md',
            'TROUBLESHOOTING.md',
            'CHANGELOG.md'
        ];

        // Get file from URL parameter
        function getFileFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('file');
        }

        // Load and render markdown file
        async function loadFile(filename) {
            const contentDiv = document.getElementById('content');
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const titleEl = document.getElementById('doc-title');

            if (!filename) {
                contentDiv.innerHTML = `
                    <p>Select a document from the dropdown above, or navigate directly with a URL parameter:</p>
                    <p><code>viewer.html?file=DEPLOYMENT.md</code></p>
                `;
                titleEl.textContent = 'Documentation';
                return;
            }

            // Validate filename
            if (!availableFiles.includes(filename)) {
                errorDiv.textContent = `File "${filename}" not found. Available files: ${availableFiles.join(', ')}`;
                errorDiv.style.display = 'block';
                contentDiv.style.display = 'none';
                return;
            }

            // Show loading
            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            contentDiv.style.display = 'none';

            try {
                const response = await fetch(filename);
                if (!response.ok) {
                    throw new Error(`Failed to load ${filename}: ${response.status} ${response.statusText}`);
                }

                const markdown = await response.text();
                const html = marked.parse(markdown);

                // Update title (remove .md extension and format)
                const title = filename.replace('.md', '').replace(/-/g, ' ');
                titleEl.textContent = title;

                // Render content
                contentDiv.innerHTML = html;
                contentDiv.style.display = 'block';
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
                contentDiv.style.display = 'block';
                contentDiv.innerHTML = '<p>Failed to load document. Please try again.</p>';
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        // Load file on page load if URL parameter exists
        window.addEventListener('DOMContentLoaded', () => {
            const file = getFileFromUrl();
            if (file) {
                const select = document.getElementById('file-select');
                select.value = file;
                loadFile(file);
            }
        });
    </script>
</body>
</html>
